server:
  port: 8080
lab:
  outbox:
    crash-after-ack: ${LAB_OUTBOX_CRASH_AFTER_ACK:false}
    poll-delay-ms: 3000
spring:
  datasource:
    url: jdbc:h2:file:${user.home}/spring-kafka-lab/orders-lab11;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: true
